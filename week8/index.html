
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header class="head">
            <h1>My Dashboard</h1>
        </header>

        <aside class="side">
            <h2>Menu</h2>
            <nav>
                <a href="#">Overview</a>
                <a href="#">Projects</a>
                <a href="#">Tasks</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="main">
            <h2>Overview</h2>

            <div class="box-container">
                <article class="dashboard-box">
                    <span class="icon">📊</span>
                    <h3>Total Projects</h3>
                    <p>12 Projects</p>
                </article>

                <article class="dashboard-box">
                    <span class="icon">✅</span>
                    <h3>Completed Tasks</h3>
                    <p>28 Tasks</p>
                </article>

                <article class="dashboard-box">
                    <span class="icon">⏳</span>
                    <h3>Pending Tasks</h3>
                    <p>5 Tasks</p>
                </article>

                <article class="dashboard-box">
                    <span class="icon">🎯</span>
                    <h3>Goals</h3>
                    <p>3 Active Goals</p>
                </article>

                <article class="dashboard-box">
                    <span class="icon">📅</span>
                    <h3>Upcoming Events</h3>
                    <p>2 Events</p>
                </article>

                <article class="dashboard-box">
                    <span class="icon">⭐</span>
                    <h3>Achievements</h3>
                    <p>8 Achievements</p>
                </article>
            </div>
        </main>

        <footer class="foot">
            <p>My Dashboard | Week 8 CSS Grid Practice</p>
        </footer>

    </div>

</body>
</html>
